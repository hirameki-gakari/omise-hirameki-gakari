<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お店のひらめき係</title>
<meta name="description" content="「今日、どこで食べよう」を検索ではなくひらめきで決める、阿佐ヶ谷・高円寺エリアの外食提案サービス。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3EDE1;
  --surface:#FFFFFF;
  --surface-soft:#EAE2D2;
  --ink:#2A241D;
  --ink-soft:#6E6455;
  --ink-faint:#9C927E;
  --accent:#BD5A24;
  --accent-deep:#8A3F16;
  --accent-soft:#F0D9BE;
  --indigo:#23384A;
  --indigo-soft:#3E5871;
  --indigo-ink:#E7EEF3;
  --line:rgba(42,36,29,0.14);
  --shadow:0 14px 32px -18px rgba(42,36,29,0.4);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191510; --surface:#221C15; --surface-soft:#2B2319;
    --ink:#F1E9DC; --ink-soft:#C2B6A2; --ink-faint:#8B7F6C;
    --accent:#E58A47; --accent-deep:#F3AC77; --accent-soft:#402A18;
    --indigo:#16232E; --indigo-soft:#2E4457; --indigo-ink:#EAF0F4;
    --line:rgba(241,233,220,0.16); --shadow:0 14px 32px -18px rgba(0,0,0,0.6);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  line-height:1.75; padding:0 18px 60px;
}
.wrap{max-width:520px; margin:0 auto;}
h1,h2,h3{text-wrap:balance; margin:0;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
img{max-width:100%;}
[hidden]{display:none !important;}

/* header */
header.top{padding:36px 0 18px;}
.eyebrow{
  font-family:"Shippori Mincho",serif; font-size:.76rem; font-weight:600;
  letter-spacing:.18em; color:var(--accent-deep);
}
header.top h1{font-size:1.7rem; font-weight:900; margin-top:8px;}
header.top .sub{color:var(--ink-soft); font-size:.94rem; margin-top:10px; max-width:30em;}

/* select screen */
.select-card{
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:26px 22px; margin-top:18px; box-shadow:var(--shadow);
}
.q-block{margin-bottom:26px;}
.q-block:last-of-type{margin-bottom:20px;}
.q-label{font-size:.92rem; font-weight:700; margin-bottom:12px; display:block;}
.chips{display:flex; flex-wrap:wrap; gap:9px;}
.chip{
  border:1px solid var(--line); border-radius:999px; padding:10px 16px;
  font-size:.86rem; background:var(--bg); color:var(--ink);
  transition:background .15s, border-color .15s, color .15s, transform .1s;
}
.chip:hover{border-color:var(--accent);}
.chip:active{transform:scale(.97);}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

.btn-primary{
  width:100%; border:none; background:var(--accent); color:#fff;
  border-radius:14px; padding:16px; font-size:.98rem; font-weight:700;
  transition:background .15s, opacity .15s;
}
.btn-primary:hover{background:var(--accent-deep);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.hint{
  text-align:center; font-size:.8rem; color:var(--ink-faint); margin-top:10px;
}

/* result screen */
.result-eyebrow{
  font-family:"Shippori Mincho",serif; font-size:.8rem; color:var(--accent-deep);
  letter-spacing:.1em; margin-top:22px;
}
.result-title{font-size:1.5rem; font-weight:900; margin-top:6px;}
.result-card{
  background:var(--indigo); color:var(--indigo-ink); border-radius:22px;
  padding:22px; margin-top:18px; box-shadow:var(--shadow);
}
.photo{
  border-radius:16px; height:170px; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:4px; text-align:center; padding:14px;
  background:linear-gradient(135deg,var(--accent-deep),var(--accent));
  color:rgba(255,255,255,.92);
}
.photo .genre-tag{font-size:.72rem; letter-spacing:.12em; opacity:.85;}
.photo .name-jp{font-size:1.15rem; font-weight:900; margin-top:2px;}
.r-body{margin-top:18px;}
.r-name{font-size:1.28rem; font-weight:900;}
.r-copy{font-family:"Shippori Mincho",serif; font-size:.98rem; color:#E7C9A0; margin-top:6px;}
.r-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.r-meta span{
  border:1px solid rgba(231,238,243,.25); border-radius:8px; padding:4px 10px; font-size:.78rem; color:#CBD6DD;
}
.reasons{
  background:rgba(231,238,243,.07); border-radius:14px; padding:16px 18px; margin-top:18px;
}
.reasons .rh{font-size:.8rem; font-weight:700; color:var(--indigo-ink); margin-bottom:8px;}
.reasons ul{margin:0; padding-left:1.1em; font-size:.86rem; color:#DCE4E9;}
.reasons li{margin-bottom:5px;}
.actions{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
.btn-go{
  display:block; text-align:center; text-decoration:none; background:var(--accent);
  color:#fff; border-radius:12px; padding:14px; font-weight:700; font-size:.92rem;
}
.btn-go:hover{background:var(--accent-deep);}
.btn-reroll{
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:transparent; border:1px dashed rgba(231,238,243,.35); color:var(--indigo-ink);
  border-radius:12px; padding:12px; font-size:.86rem;
}
.btn-reroll:hover{border-color:var(--accent);}
.btn-reroll .spin{display:inline-block; transition:transform .35s ease;}
.btn-reroll.spinning .spin{transform:rotate(340deg);}

.nearby{margin-top:26px;}
.nearby .nh{font-size:.86rem; font-weight:700; margin-bottom:10px; color:var(--ink-soft);}
.nearby-list{display:flex; flex-direction:column; gap:8px;}
.nearby-card{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:12px 14px; text-decoration:none; color:var(--ink);
}
.nearby-card:hover{border-color:var(--accent);}
.nearby-card .nm{font-size:.88rem; font-weight:700;}
.nearby-card .gn{font-size:.76rem; color:var(--ink-soft);}
.nearby-card .pr{font-size:.76rem; color:var(--accent-deep); white-space:nowrap;}

.restart{
  display:block; text-align:center; margin-top:26px; font-size:.82rem; color:var(--ink-faint);
  text-decoration:underline; background:none; border:none; width:100%; padding:8px;
}
.restart:hover{color:var(--accent-deep);}

footer{margin-top:50px; font-size:.74rem; color:var(--ink-faint); text-align:center;}
footer a{text-decoration:underline;}

@media (prefers-reduced-motion: reduce){
  .btn-reroll .spin{transition:none;}
}
</style>

<div class="wrap">

    </div>

    <div class="nearby">
      <div class="nh">近くでもう少し探す</div>
      <div class="nearby-list" id="nearby-list"></div>
    </div>

    <button class="restart" id="r-restart">はじめから選び直す</button>
  </section>

</div>

const RESTAURANTS = BASE_RESTAURANTS.concat(NEW_ROWS.map(buildRestaurant));

/* =========================================================
   誰と / 気分 の選択肢と重みづけ(Phase 8 推薦ロジック)
   ========================================================= */
const COMPANIONS = [
  {id:"solo", label:"ひとり", particle:"ひとりで"},
  {id:"couple", label:"夫婦・パートナー", particle:"夫婦で"},
  {id:"family", label:"家族", particle:"家族で"},
  {id:"friends", label:"友達", particle:"友達と"},
  {id:"colleagues", label:"仕事仲間", particle:"仲間と"}
];
const MOODS = [
  {id:"drinking", label:"飲みたい", copy:"とにかく飲みたい夜に。"},
  {id:"hearty", label:"がっつり", copy:"がっつり食べたい日に。"},
  {id:"indulgent", label:"ちょっと贅沢", copy:"ちょっと贅沢したい夜に。"},
  {id:"adventurous", label:"新しい店", copy:"新しい一軒を開拓したい日に。"},
  {id:"calm", label:"ゆっくり話したい", copy:"ゆっくり話したい夜に。"},
  {id:"budget", label:"コスパ重視", copy:"気軽に、なるべく安く。"},
  {id:"stylish", label:"おしゃれな店", copy:"おしゃれな時間を過ごしたい夜に。"},
  {id:"familyFun", label:"家族みんなで", copy:"家族みんなで楽しみたい日に。"},
  {id:"quick", label:"サクッと", copy:"サクッと済ませたい日に。"}
];

const COMPANION_WEIGHTS = {
  solo:{extra:[["atmosphere.casualLevel",0.5]]},
  couple:{extra:[["atmosphere.quietLevel",1],["audienceFit.dateFriendly",1]]},
  family:{extra:[["audienceFit.childrenFriendly",1],["quality.volume",0.5]]},
  friends:{extra:[["atmosphere.casualLevel",1],["audienceFit.largeGroupFriendly",0.5]]},
  colleagues:{extra:[["atmosphere.casualLevel",0.5],["audienceFit.largeGroupFriendly",0.5]]}
};
const MOOD_WEIGHTS = {
  hearty:{extra:[["quality.volume",1.5],["quality.costPerformance",1]]},
  drinking:{extra:[["atmosphere.casualLevel",1]]},
  indulgent:{extra:[["atmosphere.specialLevel",1.5],["atmosphere.luxuryLevel",1],["quality.foodQuality",1]]},
  budget:{extra:[["quality.costPerformance",1.5]]},
  stylish:{extra:[["atmosphere.specialLevel",1]]},
  calm:{extra:[["atmosphere.quietLevel",1.5]]},
  adventurous:{extra:[["atmosphere.specialLevel",0.5]]},
  familyFun:{extra:[["audienceFit.childrenFriendly",1.5],["quality.volume",1]]},
  quick:{extra:[["atmosphere.casualLevel",1],["quality.costPerformance",0.5]]}
};

/* =========================================================
   状態
   ========================================================= */
let selectedCompanion = null;
let selectedMood = null;
let currentPool = [];   // 直近の計算結果(スコア降順)
let currentPick = null;

function getPath(obj, path){
  return path.split(".").reduce((o,k)=> (o ? o[k] : undefined), obj);
}

function priceBucket(r){
  const avg = (r.priceRange.dinner[0] + r.priceRange.dinner[1]) / 2;
  if(avg < 1500) return 1;
  if(avg < 3500) return 2;
  if(avg < 6000) return 3;
  return 4;
}

function scoreRestaurant(r, companionId, moodId){
  let score = 0;
  score += 3 * r.companionFit[companionId];
  COMPANION_WEIGHTS[companionId].extra.forEach(([path,w]) => {
    score += w * getPath(r, path);
  });
  score += 3 * r.moodFit[moodId];
  MOOD_WEIGHTS[moodId].extra.forEach(([path,w]) => {
    score += w * getPath(r, path);
  });
  return score;
}

function getHistory(){
  try{ return JSON.parse(sessionStorage.getItem("hirameki_history") || "[]"); }
  catch(e){ return []; }
}
function pushHistory(entry){
  const h = getHistory();
  h.unshift(entry);
  try{ sessionStorage.setItem("hirameki_history", JSON.stringify(h.slice(0,3))); }
  catch(e){}
}
function resetHistory(){
  try{ sessionStorage.removeItem("hirameki_history"); }catch(e){}
}

function computePool(companionId, moodId){
  const history = getHistory();
  const lastId = history[0] ? history[0].id : null;
  return RESTAURANTS
    .filter(r => r.id !== lastId)
    .map(r => {
      let s = scoreRestaurant(r, companionId, moodId);
      const bucket = priceBucket(r);
      history.forEach((h, i) => {
        const penalty = i === 0 ? 1 : 0.5;
        if(h.genre === r.genre) s -= 3 * penalty;
        if(h.priceBucket === bucket) s -= 1.5 * penalty;
      });
      return {r, score:s, bucket};
    })
    .sort((a,b) => b.score - a.score);
}

function weightedPick(pool, topN){
  const top = pool.slice(0, Math.min(topN, pool.length));
  const minScore = Math.min(...top.map(x => x.score));
  const shifted = top.map(x => Math.max(x.score - minScore + 0.5, 0.1));
  const total = shifted.reduce((a,b)=>a+b, 0);
  let rand = Math.random() * total;
  for(let i=0; i<top.length; i++){
    rand -= shifted[i];
    if(rand <= 0) return top[i];
  }
  return top[0];
}

function buildReasons(r, companionId, moodId){
  const seeds = r.reasonSeeds || {};
  const list = [];
  (seeds[moodId] || []).forEach(t => list.push(t));
  (seeds[companionId] || []).forEach(t => { if(!list.includes(t)) list.push(t); });
  if(list.length === 0 && r.tags && r.tags[0]){
    list.push(r.tags[0] + "が魅力の一軒");
  }
  return list.slice(0, 3);
}

function mapsUrl(r){
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(r.name + " " + r.area);
}

function priceLabel(r){
  const [lo,hi] = r.priceRange.dinner;
  return "¥" + lo.toLocaleString() + "〜" + hi.toLocaleString();
}

function distanceLabel(r){
  if(r.walkMinutes) return (r.station || r.area) + " 徒歩" + r.walkMinutes + "分";
  return r.area;
}

/* =========================================================
   描画
   ========================================================= */
function renderChips(container, items, selectedId, onSelect){
  container.innerHTML = "";
  items.forEach(item => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip" + (item.id === selectedId ? " on" : "");
    btn.textContent = item.label;
    btn.addEventListener("click", () => onSelect(item.id));
    container.appendChild(btn);
  });
}

function refreshSelectScreen(){
  renderChips(document.getElementById("companion-chips"), COMPANIONS, selectedCompanion, id => {
    selectedCompanion = id;
    refreshSelectScreen();
  });
  renderChips(document.getElementById("mood-chips"), MOODS, selectedMood, id => {
    selectedMood = id;
    refreshSelectScreen();
  });
  const ready = selectedCompanion && selectedMood;
  document.getElementById("btn-hirameki").disabled = !ready;
  document.getElementById("hint-text").textContent = ready
    ? "選んだら、今日のひらめきを見てみよう"
    : "誰と、どんな夜にするか選んでね";
}

function renderResult(){
  const {r} = currentPick;
  const companion = COMPANIONS.find(c => c.id === selectedCompanion);
  const mood = MOODS.find(m => m.id === selectedMood);

  document.getElementById("r-genre-tag").textContent = r.genre;
  document.getElementById("r-photo-name").textContent = r.name;
  document.getElementById("r-name").textContent = r.name;
  document.getElementById("r-copy").textContent = companion.particle + mood.copy;

  const meta = document.getElementById("r-meta");
  meta.innerHTML = "";
  [r.area, r.genre, priceLabel(r), distanceLabel(r)].forEach(t => {
    const span = document.createElement("span");
    span.textContent = t;
    meta.appendChild(span);
  });

  const reasonsEl = document.getElementById("r-reasons");
  reasonsEl.innerHTML = "";
  buildReasons(r, selectedCompanion, selectedMood).forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    reasonsEl.appendChild(li);
  });

  document.getElementById("r-go").href = mapsUrl(r);

  const nearby = currentPool
    .filter(x => x.r.id !== r.id)
    .slice(0, 3);
  const nearbyList = document.getElementById("nearby-list");
  nearbyList.innerHTML = "";
  nearby.forEach(x => {
    const a = document.createElement("a");
    a.className = "nearby-card";
    a.href = mapsUrl(x.r);
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML =
      '<span><span class="nm">' + x.r.name + '</span><br><span class="gn">' + x.r.genre + " ・ " + distanceLabel(x.r) + '</span></span>' +
      '<span class="pr">' + priceLabel(x.r) + "</span>";
    nearbyList.appendChild(a);
  });
}

function hiramekiOnce(){
  currentPool = computePool(selectedCompanion, selectedMood);
  currentPick = weightedPick(currentPool, 5);
  pushHistory({id:currentPick.r.id, genre:currentPick.r.genre, priceBucket:currentPick.bucket});
  renderResult();
}

/* =========================================================
   イベント
   ========================================================= */
document.getElementById("btn-hirameki").addEventListener("click", () => {
  if(!selectedCompanion || !selectedMood) return;
  hiramekiOnce();
  document.getElementById("screen-select").hidden = true;
  document.getElementById("screen-result").hidden = false;
  window.scrollTo({top:0, behavior:"smooth"});
});

document.getElementById("r-reroll").addEventListener("click", (e) => {
  const btn = e.currentTarget;
  btn.classList.add("spinning");
  setTimeout(() => btn.classList.remove("spinning"), 350);
  hiramekiOnce();
});

document.getElementById("r-restart").addEventListener("click", () => {
  resetHistory();
  selectedCompanion = null;
  selectedMood = null;
  refreshSelectScreen();
  document.getElementById("screen-result").hidden = true;
  document.getElementById("screen-select").hidden = false;
  window.scrollTo({top:0, behavior:"smooth"});
});

refreshSelectScreen();
</script>
